<style>

<div id="root" data-composition-id="main" data-width="2560" data-height="1440" data-start="0" data-duration="1.6">
<div id="m" class="clip t main" data-start="0" data-duration="1.6" data-track-index="1">EINSTEIN</div>

</div>
<script>
window.__timelines=window.__timelines||{};var tl=gsap.timeline({paused:true});
tl.fromTo("#m",{opacity:0},{opacity:1,duration:0.12,ease:"none"},0.04);
