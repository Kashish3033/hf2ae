<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:720px;background:#111;overflow:hidden}
#root{position:relative;width:1280px;height:720px;background:#111}
#st{position:absolute;left:0;top:0;width:1280px;height:720px}
#ttl{position:absolute;left:0;top:110px;width:1280px;text-align:center;font-family:'Anton',sans-serif;font-size:120px;line-height:1;color:#fff;z-index:2}
#stroke{position:absolute;left:300px;top:226px;width:680px;height:46px;background:#FFD700;border-radius:20px 8px 24px 6px;transform:skewX(-8deg);z-index:1}
#bx{position:absolute;left:120px;top:560px;width:140px;height:44px;background:#FF4500;border-radius:8px}
#sig{position:absolute;left:16px;bottom:10px;font:13px monospace;color:#777;white-space:pre-wrap}
</style></head><body>
<div id="root" data-composition-id="main" data-width="1280" data-height="720" data-start="0" data-duration="6">
<div id="st" class="clip" data-start="0" data-duration="6" data-track-index="1">
<div id="stroke"></div><div id="ttl">THE REAL WOLF</div><div id="bx"></div>
<div id="sig"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="plus/craft.js"></script>
<script>
var tl=gsap.timeline({paused:true});window.__timelines={main:tl};
var sig=document.getElementById('sig');
try{
  var K=hfPlus.craft, sk=document.getElementById('stroke'), bx=document.getElementById('bx');
  function paint(p){sk.style.clipPath=K.paintPath(680,46,p,3,[0,0.5]);}
  var ps={p:0}, pp={get p(){return ps.p;},set p(v){ps.p=v;paint(v);}}; pp.p=0;
  tl.to(pp,{p:1,duration:0.8,ease:'none'},0.5);
  var FROM={x:120,y:560,width:140,height:44}, TO={x:240,y:330,width:800,height:340};
  var CI=gsap.utils.interpolate('#FF4500','#1E90FF');
  function ms(p){var s=K.matchState(p,FROM,TO);bx.style.left=s.x+'px';bx.style.top=s.y+'px';bx.style.width=s.width+'px';bx.style.height=s.height+'px';var q=Math.min(1,Math.max(0,p));bx.style.background=CI(q*q*(3-2*q));}
  var ms0={p:0}, mp={get p(){return ms0.p;},set p(v){ms0.p=v;ms(v);}}; mp.p=0;
  tl.to(mp,{p:1,duration:0.8,ease:'none'},2);
  sig.textContent='paintPath(width, height, progress, seed=1, origin=[0.5,0.5], drips=6) -> CSS clip-path | matchState(progress, from{x,y,width,height}, to) -> {x,y,width,height} (smoothstep; colour done separately)';
}catch(e){sig.textContent='ERROR: '+e.message;}
tl.set({},{},6);
</script></body></html>
