<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1280px;height:720px;background:#111;overflow:hidden}
#root{position:relative;width:1280px;height:720px;background:#111}
#st{position:absolute;left:0;top:0;width:1280px;height:720px}
.g{position:absolute;top:130px;width:420px;height:420px}
#rad{left:160px}#con{left:700px}
.l{position:absolute;top:580px;width:420px;text-align:center;font:18px monospace;color:#aaa}
#err{position:absolute;left:16px;bottom:10px;font:14px monospace;color:#f66;white-space:pre-wrap}
</style></head><body>
<div id="root" data-composition-id="main" data-width="1280" data-height="720" data-start="0" data-duration="6">
<div id="st" class="clip" data-start="0" data-duration="6" data-track-index="1">
<div class="g" id="rad"></div><div class="g" id="con"></div>
<div class="l" style="left:160px">radial, radius 84px to 336px (20% to 80%)</div><div class="l" style="left:700px">conic, angle 0 to 360</div>
<div id="err"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="plus/gradient.js"></script>
<script>
var tl=gsap.timeline({paused:true});window.__timelines={main:tl};
function showErr(m){document.getElementById('err').textContent+=m+'\n';}
try{var r=hfPlus.gradient(document.getElementById('rad'),{type:'radial',radius:84,stops:['#FFD700','#FF4500']});tl.to(r,{radius:336,duration:5,ease:'none'},0.5);}catch(e){showErr('radial: '+e.message);}
try{var c=hfPlus.gradient(document.getElementById('con'),{type:'conic',angle:0,stops:['#FFD700','#FF4500']});tl.to(c,{angle:360,duration:5,ease:'none'},0.5);}catch(e){showErr('conic: '+e.message);}
tl.set({},{},6);
</script></body></html>
