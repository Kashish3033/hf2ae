<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1280px;height:720px;background:#111;overflow:hidden}
#root{position:relative;width:1280px;height:720px;background:#111}
#st{position:absolute;left:0;top:0;width:1280px;height:720px}
#con{position:absolute;left:430px;top:150px;width:420px;height:420px;clip-path:inset(0% 0% 0% 0%)}
</style></head><body>
<div id="root" data-composition-id="main" data-width="1280" data-height="720" data-start="0" data-duration="4">
<div id="st" class="clip" data-start="0" data-duration="4" data-track-index="1"><div id="con"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="plus/gradient.js"></script>
<script>
var tl=gsap.timeline({paused:true});window.__timelines={main:tl};
var el=document.getElementById('con');
var c=hfPlus.gradient(el,{type:'conic',angle:0,x:30,y:20,stops:['#FFD700','#FF4500']});
tl.to(c,{angle:180,duration:4,ease:'none'},0);
var s=hfPlus.sweep(el,{position:-20});
tl.to(s,{position:120,duration:3,ease:'none'},0.5);
tl.fromTo(el,{clipPath:'inset(0% 100% 0% 0%)'},{clipPath:'inset(0% 0% 0% 0%)',duration:1,ease:'none'},0);
tl.set({},{},4);
</script></body></html>
