<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:720px;background:#000;overflow:hidden}
#root{position:relative;width:1280px;height:720px;background:#000}
#vw{position:absolute;left:0;top:0;width:1280px;height:720px}
#v{position:absolute;left:0;top:0;width:1280px;height:720px;object-fit:cover}
#srcsvg{position:absolute;left:0;top:0}
#err{position:absolute;left:16px;bottom:10px;font:14px monospace;color:#f66;white-space:pre-wrap}
</style></head><body>
<div id="root" data-composition-id="main" data-width="1280" data-height="720" data-start="0" data-duration="6">
<div id="vw"><video id="v" class="clip" data-start="0" data-duration="6" data-track-index="1" src="https://content.dashtoon.ai/saved-videos/da98f459-0e71-5f3b-97a4-a6b59b85eac3.mp4" muted playsinline></video></div>
<svg id="srcsvg" width="1280" height="720" viewBox="0 0 1280 720"><text id="tx" x="640" y="360" text-anchor="middle" dominant-baseline="central" font-family="Anton" font-size="260" fill="#fff">SOLVAY</text></svg>
<div id="err" class="clip" data-start="0" data-duration="6" data-track-index="3"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="plus/composite.js"></script>
<script>
var tl=gsap.timeline({paused:true});window.__timelines={main:tl};
try{
  var tx=document.getElementById('tx');
  gsap.set(tx,{scale:1.2,svgOrigin:'640 360'});
  var m=hfPlus.composite.matte(document.getElementById('vw'),tx,'alpha');
  tl.fromTo(tx,{scale:1.2,svgOrigin:'640 360'},{scale:1,svgOrigin:'640 360',duration:3,ease:'power2.out',immediateRender:false},0);
}catch(e){document.getElementById('err').textContent='ERROR: '+e.message;}
tl.set({},{},6);
</script></body></html>
