<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1280px;height:720px;background:#111;overflow:hidden}
#root{position:relative;width:1280px;height:720px;background:#111}
#st{position:absolute;left:0;top:0;width:1280px;height:720px}
svg{position:absolute;left:0;top:0}
text{font:18px monospace;fill:#aaa}
#err{position:absolute;left:16px;bottom:10px;font:14px monospace;color:#f66;white-space:pre-wrap}
</style></head><body>
<div id="root" data-composition-id="main" data-width="1280" data-height="720" data-start="0" data-duration="6">
<div id="st" class="clip" data-start="0" data-duration="6" data-track-index="1">
<svg width="1280" height="720" viewBox="0 0 1280 720">
<g transform="translate(220,180) scale(0.5)"><path id="pu" fill="#FFD700" fill-rule="evenodd"/></g>
<g transform="translate(640,180) scale(0.5)"><path id="pi" fill="#FF4500" fill-rule="evenodd"/></g>
<g transform="translate(1060,180) scale(0.5)"><path id="px" fill="#1E90FF" fill-rule="evenodd"/></g>
<text x="220" y="300" text-anchor="middle">union</text><text x="640" y="300" text-anchor="middle">intersect</text><text x="1060" y="300" text-anchor="middle">exclude</text>
<g transform="translate(420,490) scale(0.6)"><path id="om" fill="none" stroke="#FF4500" stroke-width="4"/><path id="o0" fill="none" stroke="#fff" stroke-width="4"/><path id="op" fill="none" stroke="#FFD700" stroke-width="4"/></g>
<g transform="translate(860,490) scale(0.6)"><path id="lp" fill="#7CFC00"/></g>
<text x="420" y="660" text-anchor="middle">offset -12 / 0 / +12</text><text id="lt" x="860" y="660" text-anchor="middle">live polygon sides 3 to 8</text>
</svg>
<div id="err"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="plus/shapes.js"></script>
<script>
var tl=gsap.timeline({paused:true});window.__timelines={main:tl};
function showErr(m){document.getElementById('err').textContent+=m+'\n';}
var S=hfPlus.shapes;
function circ(){return S.ellipse({x:0,y:0,rx:150,ry:150,segments:96});}
function star(){return S.star({x:0,y:0,points:5,outer:180,inner:80});}
function put(id,f){try{document.getElementById(id).setAttribute('d',S.d(f()));}catch(e){showErr(id+': '+e.message);}}
put('pu',function(){return S.union(circ(),star());});
put('pi',function(){return S.intersect(circ(),star());});
put('px',function(){return S.exclude(circ(),star());});
put('o0',function(){return star();});
put('op',function(){return S.offset(star(),12);});
put('om',function(){return S.offset(star(),-12);});
try{
  var lt=document.getElementById('lt');
  var lp=S.live(document.getElementById('lp'),function(s){return S.polygon({x:0,y:0,sides:s.sides,radius:150});},{sides:3});
  tl.to(lp,{sides:8,duration:3,ease:'none'},0.5);
}catch(e){showErr('live: '+e.message);}
tl.set({},{},6);
</script></body></html>
